[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [
    "__pycache__",
    ".deploy",
    "build",
    "dist",
    "node_modules",
    ".venv",
]

[tool.ruff.lint]
# F catches real bugs and C901 mirrors the ESLint complexity cap; style rules are left out.
select = ["F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
