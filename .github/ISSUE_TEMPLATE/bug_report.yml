name: "[BUG] Bug Report"
description: Something is broken or behaving unexpectedly
title: "[BUG] "
labels: ["type::bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you saw and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Quick Access panel
        2. Go to...
        3. See...
    validations:
      required: true

  - type: dropdown
    id: steam_mode
    attributes:
      label: Steam UI mode
      options:
        - Game Mode (Steam Deck home)
        - Big Picture Mode
        - Both / Not sure
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: The plugin version is in the footer of the Quick Access panel and the Settings page.
      value: |
        Plugin (and stable or beta):
        OS and version:
        Steam client:
        Decky Loader:
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Other plugins, themes and logs
      description: Other plugins and CSS Loader themes you use, logs (Settings → Advanced tools) or screenshots.
    validations:
      required: false
