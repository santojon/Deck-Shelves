name: "[ENHANCEMENT] Enhancement"
description: Improve something that already exists
title: "[ENHANCEMENT] "
labels: ["type::enhancement"]
body:
  - type: textarea
    id: current
    attributes:
      label: How does it work today?
    validations:
      required: true

  - type: textarea
    id: improved
    attributes:
      label: How should it work, and why is that better?
    validations:
      required: true
