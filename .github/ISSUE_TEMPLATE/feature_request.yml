name: "[FEATURE] Feature Request"
description: Propose a new feature for Deck Shelves
title: "[FEATURE] "
labels: ["type::feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want, and why?
      placeholder: I'd like to be able to...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: How should it work?
      description: From a user's point of view. Screenshots or mockups help.
    validations:
      required: false
