name: "Release · RC → Store"

# Runs after a successful release, so the store gets the new tag; only a tag commit
# carrying `[rc]` (added by bump.yml for PRs with the `rc` label) goes to the store.
on:
  # No branch filter: head_branch is the tag here, so `branches: [main]` would skip every release.
  workflow_run:
    workflows: ["Release · Publish"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  trigger-store:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[rc]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Decky Store Submission workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Release workflow #${{ github.event.workflow_run.id }} succeeded — disparando store.yml"
          gh workflow run store.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo "store.yml triggered on main"
