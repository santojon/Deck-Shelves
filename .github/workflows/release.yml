name: "Release · Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  id-token: write
  attestations: write

jobs:
  release:
    # Skip pre-release tags (v3.0.0-beta.1 etc.) — those are handled by
    # prerelease.yml. Only clean `vX.Y.Z` tags (no SemVer pre-release suffix)
    # cut a real release. Manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Install Python test/lint deps
        run: |
          python3 -m pip install -U pip setuptools
          python3 -m pip install ruff pytest

      - name: Generate report
        run: pnpm run validate:ci

      - name: Rebuild aggregates
        if: always()
        run: pnpm run reports:rebuild

      - name: Upload release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-report-${{ github.run_id }}
          # Tag runs write to release/; manual runs write to ci/.
          path: |
            site/reports/release/
            site/reports/ci/
          retention-days: 90

      - name: Commit release report
        if: always()
        env:
          # SUBMIT_TOKEN (maintainer PAT) bypasses branch protection on
          # main, so the report can be pushed directly without opening a
          # chore(report) PR that itself has to pass required checks.
          # GITHUB_TOKEN stays exported as a fallback for `gh` if the PR
          # path is still needed (e.g. SUBMIT_TOKEN missing / revoked).
          SUBMIT_TOKEN: ${{ secrets.SUBMIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.SUBMIT_TOKEN || secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/commit-report.sh

      - name: Lint (ESLint + Ruff)
        run: |
          python3 -m pip install -U pip
          python3 -m pip install ruff
          pnpm run lint

      - name: Build plugin (release mode)
        run: pnpm run build:release

      - name: Package release zip
        run: pnpm run dist

      # Same package audit CI runs: refuse a package carrying a binary for a
      # foreign architecture.
      - name: Audit package architecture
        run: python3 scripts/ci/elf-arch-audit.py "$(ls deck-shelves-v*.zip | head -1)" --forbid x86_64 --forbid i386

      # Standalone backend archive: the Python backend (`main.py` + `src/backend/`)
      # published so it can run without a plugin loader (e.g. on macOS/Windows). The
      # archive root mirrors the repo so `main.py`'s own `sys.path` splice of
      # `src/backend` resolves after extraction.
      - name: Package backend archive
        run: tar -czf deck-shelves-backend.tar.gz --exclude='__pycache__' main.py src/backend

      # Lets anyone (or a host, before it installs a download) verify the
      # release assets weren't corrupted or tampered with in transit.
      - name: Generate SHA256SUMS
        # The bundle is uploaded as `index.iife.js`, and the host matches checksum
        # lines by that exact asset name — hash it from inside dist/.
        run: |
          sha256sum deck-shelves-v*.zip deck-shelves-backend.tar.gz > SHA256SUMS
          (cd dist && sha256sum index.iife.js) >> SHA256SUMS

      # Build provenance (signed by GitHub, no key or secret): verify a download
      # with `gh attestation verify <file> --repo santojon/Deck-Shelves`. Adds no
      # release asset, so the store submission and the host's checksum check are
      # unchanged; never blocks the release.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            deck-shelves-v*.zip
            dist/index.iife.js
            deck-shelves-backend.tar.gz

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Extract release notes for tag
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Prefer the user-facing RELEASE_NOTES.md; fall back to the
          # technical CHANGELOG.md when a version is missing there.
          NOTES=""
          if [[ -f "RELEASE_NOTES.md" ]]; then
            NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" RELEASE_NOTES.md | sed '/^$/N;/^\n$/d')
          fi
          if [[ -z "$NOTES" && -f "CHANGELOG.md" ]]; then
            echo "RELEASE_NOTES.md had no section for ${VERSION} — falling back to CHANGELOG.md"
            NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
          fi
          if [[ -z "$NOTES" ]]; then
            echo "No release notes found for ${VERSION} — generate_release_notes will be used."
          fi
          {
            echo "body<<BODY_EOF"
            printf '%s\n' "$NOTES"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.SUBMIT_TOKEN || github.token }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Deck Shelves ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          files: |
            deck-shelves-v*.zip
            dist/index.iife.js
            deck-shelves-backend.tar.gz
            SHA256SUMS
      # Every #N in this release's changelog section gets a comment pointing at the release.
      - name: Comment on issues named in the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REL_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          SECTION=""
          for NAME in "${VERSION}" "Unreleased"; do
            if [ -z "$SECTION" ]; then
              SECTION=$(awk "/^## \\[${NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
            fi
          done
          ISSUES=$(printf '%s\n' "$SECTION" | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)
          if [ -z "$ISSUES" ]; then echo "No issue references in the changelog section — nothing to comment."; exit 0; fi
          for n in $ISSUES; do
            echo "Commenting on #$n"
            gh issue comment "$n" --repo "$REPO" \
              --body "🚀 Something referenced here shipped in [\`${TAG}\`](${REL_URL}). Please check whether it solves your report. 🙏" \
              || echo "Skipped #$n (PR, locked, or not commentable)"
          done

