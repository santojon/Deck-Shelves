name: "Release · Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  issues: write
  id-token: write
  attestations: write

jobs:
  release:
    # Pre-release tags belong to prerelease.yml; manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck, lint, build, tests, package and compat
        run: pnpm run validate:ci

      # Refuse a binary for a foreign architecture, as in CI.
      - name: Audit package architecture
        run: python3 scripts/ci/elf-arch-audit.py deck-shelves-v*.zip --forbid x86_64 --forbid i386

      # Keyless provenance; check with `gh attestation verify <file> --repo santojon/Deck-Shelves`.
      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            deck-shelves-v*.zip

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${TAG}"

      - name: Extract release notes for tag
        id: notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Prefer the user-facing RELEASE_NOTES.md; fall back to the
          # technical CHANGELOG.md when a version is missing there.
          NOTES=""
          if [[ -f "RELEASE_NOTES.md" ]]; then
            NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" RELEASE_NOTES.md | sed '/^$/N;/^\n$/d')
          fi
          if [[ -z "$NOTES" && -f "CHANGELOG.md" ]]; then
            echo "RELEASE_NOTES.md had no section for ${VERSION} — falling back to CHANGELOG.md"
            NOTES=$(awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md | sed '/^$/N;/^\n$/d')
          fi
          if [[ -z "$NOTES" ]]; then
            echo "No release notes found for ${VERSION} — generate_release_notes will be used."
          fi
          {
            echo "body<<BODY_EOF"
            printf '%s\n' "$NOTES"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.SUBMIT_TOKEN || github.token }}
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Deck Shelves ${{ steps.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          generate_release_notes: ${{ steps.notes.outputs.body == '' }}
          files: |
            deck-shelves-v*.zip
      # Every #N in this release's changelog section gets a comment pointing at the release.
      - name: Comment on issues named in the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REL_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          SECTION=""
          for NAME in "${VERSION}" "Unreleased"; do
            if [ -z "$SECTION" ]; then
              SECTION=$(awk "/^## \\[${NAME}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
            fi
          done
          ISSUES=$(printf '%s\n' "$SECTION" | grep -oE '#[0-9]+' | tr -d '#' | sort -un || true)
          if [ -z "$ISSUES" ]; then echo "No issue references in the changelog section — nothing to comment."; exit 0; fi
          for n in $ISSUES; do
            echo "Commenting on #$n"
            gh issue comment "$n" --repo "$REPO" \
              --body "🚀 Something referenced here shipped in [\`${TAG}\`](${REL_URL}). Please check whether it solves your report. 🙏" \
              || echo "Skipped #$n (PR, locked, or not commentable)"
          done

