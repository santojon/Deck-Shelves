name: "CI · Build & Test"

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Skip the bump-only commit on main (the auto-commit from bump.yml).
    if: |
      github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: bump version')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck, lint, build, tests, package and compat
        run: pnpm run validate:ci

      - name: Backend deps and package architecture audits
        run: |
          bash scripts/ci/arm64-pydeps-audit.sh requirements.txt
          python3 scripts/ci/elf-arch-audit.py deck-shelves-v*.zip --forbid x86_64 --forbid i386

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: deck-shelves-${{ github.sha }}
          path: deck-shelves-v*.zip

  validate-arm64:
    runs-on: ubuntu-24.04-arm
    if: |
      github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'chore: bump version')
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Typecheck, lint, build, tests, package and compat
        run: pnpm run validate:ci

      - name: Package architecture audit
        run: python3 scripts/ci/elf-arch-audit.py deck-shelves-v*.zip --forbid x86_64 --forbid i386
