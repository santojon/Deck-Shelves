name: "Release · Version Bump"

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bump:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.pull_request.merged == true &&
       (startsWith(github.event.pull_request.title, '[FIX]') ||
        startsWith(github.event.pull_request.title, '[ENHANCEMENT]') ||
        startsWith(github.event.pull_request.title, '[PERF]') ||
        startsWith(github.event.pull_request.title, '[QA]') ||
        startsWith(github.event.pull_request.title, '[REFACTOR]') ||
        startsWith(github.event.pull_request.title, '[CLEANUP]') ||
        startsWith(github.event.pull_request.title, '[FEATURE]')))
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SUBMIT_TOKEN || github.token }}

      - uses: ./.github/actions/setup

      - name: Determine bump type
        id: bump_type
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            TITLE="$PR_TITLE"
            if [[ "$TITLE" == \[REFACTOR\]* ]]; then
              echo "bump=major" >> "$GITHUB_OUTPUT"
            elif [[ "$TITLE" == \[FEATURE\]* || "$TITLE" == \[CLEANUP\]* ]]; then
              echo "bump=minor" >> "$GITHUB_OUTPUT"
            elif [[ "$TITLE" == \[FIX\]* || "$TITLE" == \[ENHANCEMENT\]* || "$TITLE" == \[PERF\]* || "$TITLE" == \[QA\]* ]]; then
              echo "bump=patch" >> "$GITHUB_OUTPUT"
            else
              echo "❌ PR title must start with [FIX], [ENHANCEMENT], [PERF], [QA], [REFACTOR], [CLEANUP], or [FEATURE]"
              exit 1
            fi
          fi

      - name: Compute new version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          BUMP="${{ steps.bump_type.outputs.bump }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="${MAJOR}.${MINOR}.${PATCH}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEW ($BUMP)"

      - name: Update package.json version
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.new }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Update pnpm-lock.yaml version
        run: pnpm install --lockfile-only

      - name: Update CHANGELOG.md and RELEASE_NOTES.md
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          DATE=$(date +%Y-%m-%d)

          unreleased() { awk '/^## \[Unreleased\]/{found=1; next} /^## \[/{exit} found{print}' "$1" | sed '/^[[:space:]]*$/d'; }
          promote() { sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${DATE}/" "$1"; }

          # The release notes are the release text, so they must have entries.
          if [[ -z "$(unreleased RELEASE_NOTES.md)" ]]; then
            echo "❌ No changes found under ## [Unreleased] in RELEASE_NOTES.md"
            exit 1
          fi
          promote RELEASE_NOTES.md

          if [[ -n "$(unreleased CHANGELOG.md)" ]]; then
            promote CHANGELOG.md
          else
            echo "CHANGELOG.md [Unreleased] is empty — no technical entries for ${VERSION}"
          fi

      - name: TypeScript check
        run: pnpm run typecheck

      - name: Lint (ESLint + Ruff)
        run: pnpm run lint

      - name: Static validation
        run: node scripts/build/validate.mjs

      - name: Configure git author
        run: |
          AUTHOR=$(node -p "require('./plugin.json').author")
          git config user.name "${AUTHOR}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Stage version files
        run: |
          git add package.json pnpm-lock.yaml CHANGELOG.md RELEASE_NOTES.md

      - name: Commit bump
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          MSG="chore: bump version to v${VERSION}"
          # `[rc]` (PRs with the `rc` label only) is what sends the release to the store.
          if echo "$PR_LABELS" | grep -q '"rc"'; then
            MSG="$MSG [rc]"
          fi
          git commit -m "$MSG"

      - name: Tag commit
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          git tag "v${VERSION}"

      - name: Push branch + tag
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          git push origin main
          git push origin "v${VERSION}" || git push origin --tags
