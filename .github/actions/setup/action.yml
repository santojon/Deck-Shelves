name: Setup
description: pnpm, Node 26, the locked dependencies and the Python tools the checks use.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Python tools
      shell: bash
      run: python3 -m pip install --upgrade ruff pytest
