<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Deck Shelves">
  <!-- Transparent background, like assets/logo.svg. Same class definitions as the
       logo; exact shelves geometry (colours, heights, widths, gaps, corner radius,
       spine stripes, the leaning book and the stroke width) kept as in the logo —
       only a single uniform transform scales and centres the whole group. -->
  <style>
    .steam-blue { fill: #0080FF; }
    .steam-blue-dark { fill: #0044B0; }
    .steam-light { fill: #FFFFFF; }
    .steam-light-soft { fill: #D2D2D2; }
    .steam-stroke-dark { stroke: #000000; stroke-width: 2; stroke-linejoin: round; }
    .round { rx: 8; ry: 8; }
  </style>
  <g transform="translate(-340.6,-224.7) scale(0.76)">
    <rect x="550" y="460" width="80" height="285" class="steam-blue steam-stroke-dark round"/>
    <rect x="551" y="500" width="79" height="25" class="steam-blue-dark"/>
    <rect x="645" y="500" width="75" height="245" class="steam-blue steam-stroke-dark round"/>
    <rect x="646" y="535" width="73" height="25" class="steam-blue-dark"/>
    <rect x="740" y="530" width="75" height="215" class="steam-light steam-stroke-dark round"/>
    <rect x="741" y="570" width="73" height="25" class="steam-light-soft"/>
    <rect x="840" y="470" width="75" height="275" class="steam-light steam-stroke-dark round"/>
    <rect x="841" y="505" width="73" height="25" class="steam-light-soft"/>
    <g transform="rotate(-15)">
      <rect x="750" y="750" width="60" height="225" class="steam-blue steam-stroke-dark round"/>
      <rect x="751" y="785" width="58" height="25" class="steam-blue-dark"/>
    </g>
    <rect x="500" y="750" width="570" height="25" class="steam-light steam-stroke-dark round"/>
    <rect x="530" y="780" width="25" height="25" class="steam-light steam-stroke-dark round"/>
    <rect x="1020" y="780" width="25" height="25" class="steam-light steam-stroke-dark round"/>
  </g>
</svg>
